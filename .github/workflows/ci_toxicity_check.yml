# Path in your repo: .github/workflows/ci-toxicity-test.yml

name: CI - Toxicity Eval Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out your code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Debug AWS Configuration
        run: |
          python -c "
          import boto3
          session = boto3.Session()
          print('Region:', session.region_name)
          creds = session.get_credentials()
          print('Access Key present:', bool(creds and creds.access_key))
          "

      - name: Run the toxicity eval script
        run: python -m Evals.evals_toxicity
